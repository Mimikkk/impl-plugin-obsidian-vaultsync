services:
  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      STORAGE_URL: /data
    volumes:
      - ${STORAGE_URL:-./data}:/data
    restart: unless-stopped
