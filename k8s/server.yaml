apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultsync-storage
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultsync-server
data:
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  STORAGE_URL: "/data"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultsync-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultsync-server
  template:
    metadata:
      labels:
        app: vaultsync-server
    spec:
      containers:
        - name: server
          image: vaultsync-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: vaultsync-server
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultsync-storage
---
apiVersion: v1
kind: Service
metadata:
  name: vaultsync-server
spec:
  selector:
    app: vaultsync-server
  ports:
    - port: 80
      targetPort: 8080
